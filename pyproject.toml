[project]
name = "db_utils"
version = "1.3.0"
description = "Utilidades para crear engines de SQLAlchemy y ejecutar SQL en Oracle, SQL Server y Teradata"
readme = "README.md"
authors = [
    { name = "Sebastián Fuentes", email = "sebastianfuentesab@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "oracledb==26.1.0",
    "pymssql==2.4.6",
    "sqlalchemy==2.1.6",
    "log_utils",
    "teradatasqlalchemy==20.0.0.9",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<1.0"]
build-backend = "uv_build"

[tool.uv.sources]
log_utils = { git = "https://github.com/SebaxFentex/log_utils", tag = "v0.1.0" }
